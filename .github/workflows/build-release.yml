name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.1)'
        required: false
        default: ''
      release_name:
        description: 'Release Title (optional, defaults to Tag)'
        required: false
        default: ''
      prerelease:
        description: 'Mark as Pre-release'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create as Draft'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Keystore (if secret provided)
        id: setup_keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/aovo-release.jks
            echo "Keystore decoded successfully."
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "No KEYSTORE_BASE64 secret found, proceeding with fallback signing."
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Clean up temporary keystore
        if: always()
        run: |
          if [ -f "app/aovo-release.jks" ] && [ "${{ steps.setup_keystore.outputs.has_keystore }}" = "true" ]; then
            rm -f app/aovo-release.jks
          fi

      - name: Extract Version Name
        id: get_version
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | awk -F'"' '{print $2}')
          VERSION_CODE=$(grep "versionCode =" app/build.gradle.kts | awk '{print $3}')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          
          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              TAG="${{ github.ref_name }}"
            else
              TAG="v$VERSION_NAME"
            fi
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          TITLE="${{ github.event.inputs.release_name }}"
          if [ -z "$TITLE" ]; then
            TITLE="Aovo Control $TAG"
          fi
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Prepare APK Artifact
        run: |
          mkdir -p dist
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" "dist/AovoControl-${{ steps.get_version.outputs.version_name }}.apk"
            echo "Artifact prepared at dist/AovoControl-${{ steps.get_version.outputs.version_name }}.apk"
          else
            echo "Error: Release APK not found!"
            exit 1
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AovoControl-${{ steps.get_version.outputs.version_name }}
          path: dist/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: ${{ steps.get_version.outputs.title }}
          draft: ${{ github.event.inputs.draft }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: dist/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
